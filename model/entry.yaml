id: z-image-turbo-fp8

# Which model adapter serves this entry (protocol section 6.3). The core does
# not know what Z-Image is; this names the module that does.
adapter: zimage

checkpoint: model/assets/checkpoint.safetensors

components:
  transformer_config: model/z_image.json
  transformer_config_digest: sha256:06d49d1ae533f825c4704cc616fc8bc7826e9d449dde292cc7a95163c69af24a
  vae: model/assets/vae.safetensors
  vae_config: model/assets/vae_config.json
  text_encoder: model/assets/qwen3/qwen3_quanto_bf16_int8.safetensors
  text_encoder_dir: model/assets/qwen3
  scheduler_config: model/assets/scheduler_config.json

steps: 12
guidance: 0.0

# The largest area this card has been measured to render: 1280x720, 43.5 s,
# 6698 MiB reserved leaving 1159 MiB of slack. Raising it is a measurement,
# not a configuration change.
limits:
  max_pixels: 921600

request_fields:
  - prompt
  - seed
  - width
  - height
  - out
  - upscale

expected_census:
  float8: 239
  plain: 282
  other: 0
  total: 521

defaults:
  width: 1280
  height: 720
  format: png

warmup:
  width: 512
  height: 512
  prompt: warm up
  seed: 0
