# The promoted default entry: FLUX.2 [klein] 4B through the community Q4_K_M
# GGUF, on the `ggml` runtime. A service booted without `--model` serves this.
#
# Two entries coexist and one model is served at a time, because the card is
# single (protocol section 6.1). Z-Image Turbo FP8 — the historical production
# model — lives unchanged at `model/entries/zimage.yaml` and is served with
# `start --model z-image-turbo-fp8`; this entry is served with
# `start --model flux2-klein-4b-gguf-q4`.
#
# This entry's `checkpoint` is the quantised **diffusion model**, and its
# components are the two other artefacts `sd-cli` needs — the Qwen3-4B encoder as
# a GGUF and the FLUX.2 VAE as the safetensors the official pipeline ships — plus
# the vendored binary itself. Nothing here is read by Python's model stack: the
# adapter runs `sd-cli` as a subprocess.
id: flux2-klein-4b-gguf-q4

adapter: flux2klein_sd

checkpoint: model/assets/flux2-klein/gguf/flux-2-klein-4b-Q4_K_M.gguf

components:
  vae: model/assets/flux2-klein/official/vae/diffusion_pytorch_model.safetensors
  llm: model/assets/flux2-klein/gguf/Qwen3-4B-Q4_K_M.gguf
  cli: vendor/stable-diffusion.cpp/build/bin/sd-cli

digests:
  # The runtime is installed inside the tree and never committed (protocol
  # section 2, declared exception), so its identity is pinned here: this is the
  # binary built from commit 532d2c1 **with**
  # patches/0001-flux2-lora-name-conversion.patch applied — the build that makes
  # a FLUX.2 LoRA apply in full instead of discarding half its tensors — and a
  # rebuilt one must update this line. The pre-patch build pinned
  # a5f17d22af14…; this tree is the patched one.
  cli: sha256:3069c361c226fff978a75037c63cdfd364c9b4a4d1f822523506ba49a233acb6
  vae: sha256:ca70d2202afe6415bdbcb8793ba8cd99fd159cfe6192381504d6c4d3036e0f04
  llm: sha256:f6f851777709861056efcdad3af01da38b31223a3ba26e61a4f8bf3a2195813a

# Eight steps, by the operator's ruling of 2026-11-17. Measured at 1024x1024,
# one prompt and one seed: 4 steps cost 10.8 s, 6 cost 14.1 s and 8 cost 16.9 s
# (+31 % and +56 % of the four-step wall), and **four steps break an occlusion
# that six and eight render correctly** — the bartender's body merged into the
# bar counter (docs/reference/flux2-klein.md, T3). The range below is bounded by
# what was rendered: 8 is the largest count measured, so nothing above 8 is
# declared.
steps: 8
guidance: 1.0

limits:
  # 1152x1152 = 1,327,104 px, measured at four steps: 13.4 s and 4701 MiB with
  # 3156 MiB of the card's 7857 usable still free (T4). It is the largest box
  # rendered, so it is the ceiling. The operator read the ladder's contact sheet
  # as the best distribution of figures at 1152x1152 — an indication resting on
  # one prompt and one seed, not a distribution — and the defaults below follow
  # it. The pair is measured too: 1152x1152 at eight steps is 28.693 s through
  # the service with the device peaking at 4815 MiB, so the defaults cost about
  # two and a half times the old 1024x1024 at four steps.
  max_pixels: 1327104
  steps: {min: 4, max: 8}

request_fields:
  - prompt
  - seed
  - width
  - height
  - out
  - steps
  - upscale
  - lora

# The LoRA catalog: what this model may be asked for, under aliases this entry
# owns (protocol section 6.1). A request names an alias — `--lora pixel-art:0.5`
# or `{"lora": ["pixel-art:0.5"]}` — and never a path; `weight` is the default a
# request inherits when it names the alias without one, and a request's own
# weight replaces it. A catalog is per model: an entry without this block accepts
# no LoRA at all, which is why Z-Image's entry has none.
#
# The three files are this tree's own copies under this entry's own folder,
# `model/assets/loras/flux2-klein-4b-gguf-q4/`, and are not committed (the ignore
# file keeps weights out). **A model owns its LoRAs**: reuse across models is
# possible but unverified — two checkpoints can share a family and a module tree
# and still disagree — so a LoRA that works on a second model is copied into that
# model's folder, never shared by path (protocol sections 3 and 6.1), and a
# catalog path outside this folder refuses the boot.
#
# The runtime selects one from the prompt with `<lora:NAME:WEIGHT>`, resolved
# against `--lora-model-dir`; that syntax is `flux2klein_sd`'s business (section
# 6.3), and the aliases here are the only names a caller ever sees.
#
# `pixel-art` is the 325 MB LoRA the runtime patch was measured on: sprites and
# characters, 172 tensors, and the reason `patches/0001-flux2-lora-name-conversion.patch`
# exists — unpatched, half of it was discarded as unused. Its own card prompt is
# "pixel art sprite, a brave knight in shining armor holding a sword, game asset,
# transparent background". `anime` is 185 MB. `background-remove` is 76 MB and its
# instance prompt is "Remove the background from the image".
loras:
  pixel-art:
    path: model/assets/loras/flux2-klein-4b-gguf-q4/pixel-art.safetensors
    weight: 1.0
  anime:
    path: model/assets/loras/flux2-klein-4b-gguf-q4/anime.safetensors
    weight: 0.5
  background-remove:
    path: model/assets/loras/flux2-klein-4b-gguf-q4/background-remove.safetensors
    weight: 0.5

# The subprocess owns the tensor graph and its stdout is prose, so this path
# cannot count parameters. What it can prove is what it handed the child: three
# artefacts, 5,269,713,294 bytes in total (the diffusion model, the encoder and
# the VAE). The adapter measures this from the files it passes on every call.
expected_census:
  artifacts: 3
  bytes: 5269713294

# The best measured box, by the operator's ruling of 2026-11-17 (see the ceiling
# comment: one prompt, one seed).
defaults:
  width: 1152
  height: 1152
  format: png

warmup:
  width: 512
  height: 512
  prompt: warm up
  seed: 0
